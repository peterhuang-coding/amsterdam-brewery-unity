<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>D26 parent Canvas validation</title><style>body{margin:0;background:#14293a;color:#eee;font:13px sans-serif}h1{font-size:14px;padding:8px;margin:0}canvas{width:calc(100vw - 28px);max-width:1100px;height:auto;display:block;margin:0 14px}pre{white-space:pre-wrap;padding:8px}</style><h1>父级实际 Canvas 验收 · 真实轮廓候选，非游戏交付</h1><canvas id="test" width="1100" height="640"></canvas><pre id="status">loading full candidate…</pre><script src="geo-map-renderer.js"></script><script>
window.ready=false;window.errors=[];addEventListener('error',e=>errors.push(e.message));
(async()=>{let t=performance.now();let data=await(await fetch('runtime-full.json')).json();window.loadMs=performance.now()-t;window.data=data;window.anchors=await(await fetch('parent-anchors.json')).json();let created=[];t=performance.now();window.renderer=AmsterdamGeoRenderer.create(data,{canvasFactory:(w,h)=>{let c=document.createElement('canvas');c.width=w;c.height=h;created.push([w,h]);return c}});window.indexMs=performance.now()-t;window.cacheSizes=created;window.drawTest=(camera='street',night=false,zoom=1,target='lotte',who='pub')=>{let c=document.getElementById('test'),ctx=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,1.5);c.width=1100*dpr;c.height=640*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);let names={pub:'酒馆 Tweede Kans',lotte:'Lotte 的桥',market:'街市',coffee:'咖啡店',flowers:'花店',lab:'Chen 实验室',ferryNorth:'Noord 北岸',ferrySouth:'Centraal 渡轮码头',flowerCart:'花车',garden:'玻璃屋后的门'};let places=Object.entries(anchors).filter(([id])=>!['garden','flowerCart'].includes(id)).map(([id,a])=>({id,name:names[id],...a}));let view={position:{...anchors[who],visited:[],bike:{...anchors.pub,mounted:false}},camera,zoom,mode:'map',target,afterHours:night,reducedMotion:true,time:0,path:[],flowerCart:anchors.flowerCart};let opts={width:1100,height:640,cssWidth:c.getBoundingClientRect().width,places,gardenEntry:{id:'garden',name:names.garden,...anchors.garden}};let start=performance.now();let result=renderer.draw(ctx,view,opts);let elapsedMs=performance.now()-start;let t=ctx.getTransform();window.last={camera,night,zoom,target,who,cssWidth:opts.cssWidth,elapsedMs,result,stats:renderer.stats(),contextTransform:[t.a,t.b,t.c,t.d,t.e,t.f],cacheSizes};document.getElementById('status').textContent=JSON.stringify({loadMs,indexMs,elapsedMs,cssWidth:opts.cssWidth,labels:result.labels,stats:renderer.stats()},null,2);return last};window.drawTest();window.ready=true;})().catch(e=>{errors.push(String(e));document.getElementById('status').textContent=String(e)});
</script>
