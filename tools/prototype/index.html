<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c49">
  <title>Tweede Kans · 运河边的第二次机会</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='8' fill='%23233943'/%3E%3Ctext x='24' y='32' text-anchor='middle' font-family='Georgia' font-size='24' fill='%23edbd79'%3ETK%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="reopening.css">
  <link rel="stylesheet" href="backstage.css">
  <script src="backstage-core.js" defer></script>
  <script src="reopening-core.js" defer></script>
  <script src="reopening-city.js" defer></script>
  <script src="reopening-scene.js" defer></script>
  <script src="backstage-scene.js" defer></script>
  <script src="backstage-ui.js" defer></script>
  <script src="reopening-ui.js" defer></script>
</head>
<body>
  <div class="game-shell">
    <header class="masthead">
      <a class="wordmark" href="index.html" aria-label="Tweede Kans 首页"><span class="pub-mark">TK</span><span>Tweede Kans<small>AMSTERDAM · SINDS 1986</small></span></a>
      <div class="day-track" id="day-track" aria-label="三天重开进度"></div>
      <nav class="utility" aria-label="游戏工具">
        <button id="sound-button" class="icon-button" aria-label="关闭声音" title="声音">♪</button>
        <button id="help-button" class="icon-button" aria-label="查看玩法帮助" title="帮助 H">?</button>
        <button id="pause-button" class="icon-button" aria-label="暂停游戏" title="暂停 P">Ⅱ</button>
      </nav>
    </header>

    <main>
      <div class="chapter-heading"><div><p class="eyebrow" id="chapter-kicker">运河边 · 一家有故事的小酒吧</p><h1 id="chapter-title">再亮一次灯。</h1></div><div class="resources" aria-label="店铺资源"><div><span>手头现金</span><strong id="cash">€45</strong></div><div><span>金色艾尔</span><strong id="blond-stock">6 <small>杯</small></strong></div><div><span>运河黑啤</span><strong id="stout-stock">2 <small>杯</small></strong></div></div></div>

      <div class="play-layout">
        <section class="pub-column" aria-label="酒吧与顾客">
          <div class="pub-room">
            <canvas id="pub-canvas" width="1100" height="640" role="img" aria-label="运河边的 Tweede Kans 酒吧，窗外是阿姆斯特丹，柜台上的酒瓶会随库存变化"></canvas>
            <div class="room-label"><span class="live-dot"></span><span id="room-time">门口的灯，还亮着</span></div>
            <div class="room-caption" id="room-caption">这家店，值得再来一次。</div>
            <div class="equipment" id="equipment"></div>
          </div>
          <div id="backstage-controls" class="backstage-controls" hidden aria-label="城市背面探险操作">
            <div class="exp-status"><div><span>收班前</span><strong id="exp-clock">180s</strong></div><div><span>背包</span><strong id="exp-load">0 / 8</strong></div><div><span>状态</span><strong id="exp-health">●●●</strong></div><button data-action="exp-command" data-verb="map">地图 · M</button></div>
            <div class="exp-controls-row"><div class="exp-dpad" aria-label="按住移动"><button data-exp-move="w" aria-label="向上移动">↑</button><button data-exp-move="a" aria-label="向左移动">←</button><button data-exp-move="s" aria-label="向下移动">↓</button><button data-exp-move="d" aria-label="向右移动">→</button></div><div class="exp-tools"><button id="exp-hook" data-action="exp-command" data-verb="hook">钩拉 · J</button><button id="exp-foam" data-action="exp-command" data-verb="foam">泡沫 · F</button><button id="exp-dash" data-action="exp-command" data-verb="dash">闪避 · Space</button><button data-action="exp-command" data-verb="drop">扔下 · Q</button><button id="exp-context" data-action="exp-command" data-verb="interact">靠近后互动 · E</button></div></div>
            <p class="exp-controls-note">WASD / 方向键移动 · 鼠标瞄准，点击下钩 / 右键泡沫 · 纯键盘时朝行走方向使用工具 · P 暂停</p>
          </div>
          <div id="city-toolbar" class="city-toolbar" hidden></div>
          <div class="queue-heading"><h2 id="queue-title">门口的留言</h2><span id="night-clock"></span></div>
          <div id="queue" class="guest-queue"></div>
          <div id="pour-stations" class="pour-stations"></div>
          <div class="story-line" id="story-line"><span class="quote-mark">“</span><p>重新开张那晚，我想坐回窗边的老位子。</p><span class="story-author">— Lotte</span></div>
        </section>

        <aside class="action-board" aria-label="当前行动">
          <div id="action-content"></div>
        </aside>
      </div>

      <section class="journal" aria-label="营业记录"><div class="journal-heading"><h2>柜台记事</h2><span id="save-status">进度自动保存在这台设备</span></div><ol id="journal-entries"></ol></section>
    </main>
    <footer><span>TWEEDE KANS <i>意为「第二次机会」</i></span><span id="control-hint">鼠标或键盘操作 · H 查看帮助 · P 暂停</span><a href="legacy.html">旧版实验室 ↗</a></footer>
  </div>

  <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="overlay" class="overlay" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">
      <p class="eyebrow" id="dialog-kicker"></p><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions" class="dialog-actions"></div>
    </section>
  </div>
  <noscript><p class="no-script">这个小游戏需要启用 JavaScript 才能营业。</p></noscript>
</body>
</html>
