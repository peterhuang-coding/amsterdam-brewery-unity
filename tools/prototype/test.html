<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Amsterdam Brewery Web Demo Tests</title>
<style>body{font:16px system-ui;background:#0a0c14;color:#e0d8c8;padding:24px}h2.pass{color:#78c878}h2.fail{color:#f05050}.row{margin:6px 0;font-family:monospace}.pass{color:#78c878}.fail{color:#f05050}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style></head>
<body><h1>Web Demo contract tests</h1><div id="results">正在加载…</div><iframe id="demo" src="index.html?seed=42"></iframe>
<script>
const results=document.getElementById('results'),frame=document.getElementById('demo');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function row(ok,name,detail=''){const el=document.createElement('div');el.className='row '+(ok?'pass':'fail');el.textContent=(ok?'PASS':'FAIL')+' — '+name+(detail?' · '+detail:'');results.appendChild(el);return ok}

frame.addEventListener('load',async()=>{
  results.textContent='';let passed=0,total=0;
  const check=(name,fn)=>{total++;try{const r=fn();if(row(Boolean(r),name,typeof r==='object'&&r&&r.detail?r.detail:''))passed++}catch(e){row(false,name,e.message)}};

  // Wait for AB_TEST ready
  for(let i=0;i<80;i++){if(frame.contentWindow&&frame.contentWindow.AB_TEST)break;await wait(100)}
  const win=frame.contentWindow,doc=frame.contentDocument;
  const t=win.AB_TEST;

  // Phase 1: contract tests against the loaded instance
  check('测试接口可用',()=>t&&t.validate);
  const v=t.validate();
  check('定义 5 个产业',()=>v.industries);
  check('事件 ID 唯一',()=>v.eventIds);
  check('升级 ID 唯一',()=>v.upgradeIds);
  check('所有事件有效果说明',()=>v.modifierEffects);
  check('冲浪入口存在',()=>v.surfEntry);
  // Round 6 — Amsterdam-themed upgrades (ov_fiets / museumkaart / iamsterdam_card / heineken_pass / coffee_passport / canal_cruise)
  const amIds=['ov_fiets','museumkaart','iamsterdam_card','heineken_pass','coffee_passport','canal_cruise'];
  check('6 个阿姆斯特丹升级全部存在',()=>amIds.every(id=>t.data.upgrades.some(u=>u.id===id)));
  check('阿姆斯特丹升级 cat=阿姆斯特丹',()=>amIds.every(id=>{const u=t.data.upgrades.find(x=>x.id===id);return u&&u.cat==='阿姆斯特丹'}));
  check('阿姆斯特丹升级均含中文描述',()=>amIds.every(id=>{const u=t.data.upgrades.find(x=>x.id===id);return u&&u.t&&u.d&&u.cost>0}));
  check('升级 ID 唯一含阿姆斯特丹项',()=>v.upgradeIds);
  check('museumkaart 学术因子=1.25',()=>{const had=t.state.upgrades.slice();t.state.upgrades=['museumkaart'];const f=win.industryFactor('academic');t.state.upgrades=had;return Math.abs(f-1.25)<1e-6});
  check('coffee_passport 咖啡因子=1.2',()=>{const had=t.state.upgrades.slice();t.state.upgrades=['coffee_passport'];const f=win.industryFactor('coffee');t.state.upgrades=had;return Math.abs(f-1.2)<1e-6});
  check('museumkaart 叠加 museum_night=1.875',()=>{const had=t.state.upgrades.slice(),hadMods=t.state.mods.slice();t.state.upgrades=['museumkaart'];t.state.mods=[{id:'museum_night'}];const f=win.industryFactor('academic');t.state.upgrades=had;t.state.mods=hadMods;return Math.abs(f-1.875)<1e-6});
  check('Seed 缩写稳定',()=>t.seedAbbrev(42)===t.seedAbbrev(42));
  check('相同 Seed 的每日事件稳定',()=>{const a=t.rollDayModifier().id,b=t.rollDayModifier().id;return a===b});
  check('Run 状态范围合法',()=>t.state.day>=1&&t.state.day<=7&&t.state.run>=0);
  check('目标生成固定为 3 条',()=>{t.rollDayObjectives();return t.state.objs.length===3});
  check('目标至少含 1 项 Explore 或 Talk',()=>t.state.objs.some(o=>o.cat==='Explore'||o.cat==='Talk'));
  check('升级 ID 含 ipa_recipe/extra_event/event_freq',()=>t.data.upgrades.some(u=>u.id==='ipa_recipe')&&t.data.upgrades.some(u=>u.id==='extra_event')&&t.data.upgrades.some(u=>u.id==='event_freq'));
  const snapped=t.clampTargetToWalkable(400,158);
  check('运河改道函数可用',()=>snapped&&(snapped.y===144||snapped.y===158||snapped.y===286));

  // ═══ Round 6 — Achievement system + WebAudio ═══
  check('ACH_POOL 至少 10 个成就',()=>t.data.achievements&&t.data.achievements.length>=10);
  check('所有成就 ID 唯一',()=>new Set(t.data.achievements.map(a=>a.id)).size===t.data.achievements.length);
  check('每个成就有 ic/n/d',()=>t.data.achievements.every(a=>a.ic&&a.n&&a.d));
  // tryUnlock: calling twice should only fire once
  const beforeUnlock=t.state.achievements.length;
  const unlockA=win.tryUnlock('first_run');const unlockB=win.tryUnlock('first_run');
  check('tryUnlock 首次 true · 重复 false',()=>unlockA===true&&unlockB===false);
  check('tryUnlock 持久化到 state.achievements',()=>t.state.achievements.includes('first_run'));
  check('AUDIO.play 函数存在',()=>t.AUDIO&&typeof t.AUDIO.play==='function');
  check('AUDIO.blip 函数存在',()=>t.AUDIO&&typeof t.AUDIO.blip==='function');
  check('AUDIO.noise 函数存在',()=>t.AUDIO&&typeof t.AUDIO.noise==='function');
  // Try each preset to confirm no exception
  let audioOk=true;
  for(const k of['brew_ok','brew_fail','coffee_sale','coffee_raid','shroom_pick','surf_perfect','surf_catch','bar_clink','bar_sale','objective','achievement','click','raid_alarm']){
    try{t.AUDIO.play(k)}catch(_){audioOk=false}
  }
  check('AUDIO 13 个预设全部可调用',()=>audioOk);
  // Reset per-run counters exist
  check('G._run 计数器存在',()=>t.state._run&&typeof t.state._run==='object');
  // Save & load roundtrip (synthetic)
  const prevAch=t.state.achievements.slice();
  t.state.achievements=['first_run','mega_profit'];
  win.saveAch();
  win.loadAch();
  check('saveAch/loadAch 往返一致性',()=>JSON.stringify(t.state.achievements.sort())===JSON.stringify(['first_run','mega_profit']));
  t.state.achievements=prevAch;win.saveAch();
  check('fresh 下 start-modal 可见',()=>!doc.getElementById('start-modal').classList.contains('hidden'));
  // Modal guard: W should not move player while modal visible
  const ty0=t.state.p.ty;
  win.dispatchEvent(new KeyboardEvent('keydown',{key:'w',bubbles:true}));
  await wait(120);
  check('模态打开时 WASD 不修改目标',()=>t.state.p.ty===ty0);
  // Enter in seed input
  doc.getElementById('start-seed').value='7';
  doc.getElementById('start-seed').focus();
  doc.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
  await wait(500);
  check('教程输入框回车可启动',()=>t.state.seed===7&&doc.getElementById('start-modal').classList.contains('hidden'));
  // Auto-run completes within 100s
  t.newRun(42);t.state.ended=false;
  doc.getElementById('ba').click();
  let reached=false;
  for(let i=0;i<200;i++){if(t.state.ended){reached=true;break}await wait(500)}
  check('自动运行跑满 7 天必达 ended',()=>reached);
  // Pick upgrade → next run counter +1
  const beforeRun=t.state.run,beforeUpgrades=t.state.upgrades.length;
  const next=t.data.upgrades.find(u=>!t.state.upgrades.includes(u.id));
  if(!next){row(false,'有可购买升级','')}
  else{
    t.state.meta=Math.max(t.state.meta,next.cost);
    win.eval(`pickUpgrade(${JSON.stringify(next)})`);
    await wait(200);
    check('购买升级后 run 计数 +1 且 upgrades 增加',()=>t.state.run===beforeRun+1&&t.state.upgrades.length===beforeUpgrades+1);
    check('升级后 G.ended 已复位',()=>t.state.ended===false);
  }

  // ═══ Round 1 — Amsterdam geo schema (map-replica-v1) ═══
  const G = t.geo;
  check('AMSTERDAM_GEO 已挂载',()=>G && typeof G === 'object');
  check('AMSTERDAM_GEO 有 VERSION 字段',()=>G && typeof G.VERSION === 'string' && G.VERSION.startsWith('map-replica-v1'));
  check('AMSTERDAM_GEO 有 BOUNDS/ORIGIN',()=>G && G.BOUNDS && G.ORIGIN && Number.isFinite(G.BOUNDS.south) && Number.isFinite(G.BOUNDS.north));
  check('AMSTERDAM_GEO 投影函数可用',()=>G && typeof G.lngLatToCanvas === 'function' && typeof G.canvasToLngLat === 'function');
  const _r = G.lngLatToCanvas(52.3600, 4.8852);
  check('Rijksmuseum 投影 x 在 [-500, 500]',()=>_r && Math.abs(_r.x) < 500);
  check('Rijksmuseum 投影 y 在 [-500, 500]',()=>_r && Math.abs(_r.y) < 500);
  const _rr = G.canvasToLngLat(_r.x, _r.y);
  check('canvas→lngLat 往返精度 < 1e-6',()=>Math.abs(_rr.lat - 52.3600) < 1e-6 && Math.abs(_rr.lng - 4.8852) < 1e-6);
  check('distanceMeters(Rijksmuseum↔Anne Frank) 在 [1500, 1900] m',()=>{
    const d = G.distanceMeters({lat:52.3600,lng:4.8852},{lat:52.3752,lng:4.8840});
    return d > 1500 && d < 1900;
  });
  check('LANDMARKS 至少 12 条',()=>G.LANDMARKS.length >= 12);
  check('LANDMARKS id 全部唯一',()=>new Set(G.LANDMARKS.map(l=>l.id)).size === G.LANDMARKS.length);
  check('LANDMARKS 全部含 name/nameZh/kind/lat/lng',()=>G.LANDMARKS.every(l=>l.id && l.name && l.nameZh && l.kind && Number.isFinite(l.lat) && Number.isFinite(l.lng)));
  check('LANDMARKS 全部在 BOUNDS 内',()=>G.LANDMARKS.every(l=>l.lat>=G.BOUNDS.south && l.lat<=G.BOUNDS.north && l.lng>=G.BOUNDS.west && l.lng<=G.BOUNDS.east));
  for (const id of ['rijksmuseum','van_gogh','anne_frank','centraal','dam_square','vondelpark','heineken','jordaan','de_pijp','ndsm','plantage','ijburg']) {
    check(`LANDMARKS 含 ${id}`,()=>G.LANDMARKS.some(l=>l.id===id));
  }
  check('CANALS 至少 9 条',()=>G.CANALS.length >= 9);
  check('CANALS id 全部唯一',()=>new Set(G.CANALS.map(c=>c.id)).size === G.CANALS.length);
  check('CANALS 每条 ≥3 锚点',()=>G.CANALS.every(c=>c.points && c.points.length >= 3));
  check('CANALS 每条 width > 0',()=>G.CANALS.every(c=>c.width > 0));
  for (const id of ['singel','prinsengracht','keizersgracht','herengracht','amstel','ij','brouwersgracht','leidsegracht','kloveniersburgwal']) {
    check(`CANALS 含 ${id}`,()=>G.CANALS.some(c=>c.id===id));
  }
  check('BRIDGES 含 Magere Brug (magere_brug)',()=>G.BRIDGES.some(b=>b.id==='magere_brug'));
  check('BRIDGES 含 Blauwbrug',()=>G.BRIDGES.some(b=>b.id==='blauwbrug'));
  check('validate() ok=true',()=>G.validate().ok);
  check('validate().errors 为空数组',()=>G.validate().errors.length === 0);
  check('stats() 返回 landmarks=30 (R5 加 16 地标)',()=>G.stats().landmarks === 30);
  check('stats() 返回 canals=9',()=>G.stats().canals === 9);
  check('stats().canvas.w 在 [400, 800] px',()=>{const c=G.stats().canvas;return c.w>400 && c.w<800});
  check('stats().canvas.h 在 [400, 800] px',()=>{const c=G.stats().canvas;return c.h>400 && c.h<800});
  check('projectedBoundsPx() 等于 stats().canvas',()=>{
    const a = G.projectedBoundsPx(), b = G.stats().canvas;
    return Math.abs(a.x-b.x)<1e-3 && Math.abs(a.y-b.y)<1e-3 && Math.abs(a.w-b.w)<1e-3 && Math.abs(a.h-b.h)<1e-3;
  });

  // ═══ Round 2 — map-replica-v1 renderer ═══
  const R = t.renderer;
  check('MAP_RENDERER 已挂载',()=>R && typeof R === 'object');
  check('MAP_RENDERER VERSION 字段',()=>R && typeof R.VERSION === 'string' && R.VERSION.startsWith('map-replica-v1'));
  check('KIND_ICON 覆盖 8 种 kind',()=>R && ['museum','station','park','square','district','brewery','venue','religious'].every(k=>R.KIND_ICON[k]));
  check('KIND_COLOR 覆盖 8 种 kind',()=>R && ['museum','station','park','square','district','brewery','venue','religious'].every(k=>R.KIND_COLOR[k]));
  const vp800x500 = R.viewportFit(G, 800, 500, 24);
  check('viewportFit 800×500 返回 {scale,ox,oy,w,h}',()=>vp800x500 && Number.isFinite(vp800x500.scale) && Number.isFinite(vp800x500.ox) && Number.isFinite(vp800x500.oy) && Number.isFinite(vp800x500.w) && Number.isFinite(vp800x500.h));
  check('viewportFit scale > 0 且 < 5',()=>vp800x500 && vp800x500.scale > 0 && vp800x500.scale < 5);
  check('viewportFit drawn 尺寸 ≤ 800×500 (含 pad)',()=>vp800x500 && vp800x500.w <= 800 && vp800x500.h <= 500);
  check('viewportFit drawn 居中 (ox+pad≥0, oy+pad≥0)',()=>vp800x500 && vp800x500.ox + 24 >= -1 && vp800x500.oy + 24 >= -1);
  const scene = R.buildReplicaScene(G, 800, 500, {pad:18});
  check('buildReplicaScene 返回 landmarks=30',()=>scene && scene.counts.landmarks === 30);
  check('buildReplicaScene 返回 canals=9',()=>scene && scene.counts.canals === 9);
  check('buildReplicaScene 返回 bridges≥30 (R3 扩容)',()=>scene && scene.counts.bridges >= 30);
  check('buildReplicaScene 每条运河 ≥2 投影点',()=>scene && scene.canals.every(c => c.points && c.points.length >= 2));
  check('buildReplicaScene 每条运河 widthPx > 0',()=>scene && scene.canals.every(c => c.widthPx > 0));
  check('buildReplicaScene 每条运河 widthPx ≤ 8',()=>scene && scene.canals.every(c => c.widthPx <= 8));
  check('buildReplicaScene 每个地标含 icon/color',()=>scene && scene.landmarks.every(l => l.icon && l.color));
  check('buildReplicaScene 每个地标 (x,y) 在 [0,W]×[0,H]',()=>scene && scene.landmarks.every(l => l.x >= -1 && l.x <= 801 && l.y >= -1 && l.y <= 501));
  check('buildReplicaScene Rijksmuseum 投影 x < Centraal x (东)',()=>{
    const r = scene.landmarks.find(l=>l.id==='rijksmuseum');
    const c = scene.landmarks.find(l=>l.id==='centraal');
    return r && c && r.x < c.x;
  });
  check('buildReplicaScene Vondelpark x < Rijksmuseum (西)',()=>{
    const v = scene.landmarks.find(l=>l.id==='vondelpark');
    const r = scene.landmarks.find(l=>l.id==='rijksmuseum');
    return v && r && v.x < r.x;
  });
  check('buildReplicaScene IJburg 投影 x 最右 (东端)',()=>{
    const ij = scene.landmarks.find(l=>l.id==='ijburg');
    const others = scene.landmarks.filter(l=>l.id!=='ijburg');
    return ij && others.every(o => ij.x >= o.x);
  });
  check('buildReplicaScene 5 桥坐标都在画布内',()=>scene && scene.bridges.every(b => b.x >= 0 && b.x <= 800 && b.y >= 0 && b.y <= 500));
  // Render to an in-memory canvas context; verify no throw + pixel touched.
  const buildFakeCtx = (sink) => ({
    save(){},restore(){},fillRect(){sink.push('fillRect')},strokeRect(){sink.push('strokeRect')},
    beginPath(){sink.push('beginPath')},moveTo(){sink.push('moveTo')},lineTo(){sink.push('lineTo')},
    closePath(){sink.push('closePath')},
    stroke(){sink.push('stroke')},fill(){sink.push('fill')},arc(){sink.push('arc')},
    translate(){sink.push('translate')},rotate(){sink.push('rotate')},
    fillText(){sink.push('fillText')},strokeText(){sink.push('strokeText')},
    measureText(){sink.push('measureText');return{width:10}},
    clearRect(){},setLineDash(){},setTransform(){},transform(){},scale(){},clip(){},
    set fillStyle(v){},set strokeStyle(v){},set lineWidth(v){},set lineCap(v){},set lineJoin(v){},
    set font(v){},set textAlign(v){},set textBaseline(v){},set globalAlpha(v){},
  });
  let renderOk=false, renderTouched=false;
  try{
    const calls=[];
    R.renderReplicaOverlay(buildFakeCtx(calls), G, 800, 500, {pad:18});
    renderOk = true;
    renderTouched = calls.length >= 10;  // any meaningful draw happened
  }catch(e){renderOk=false;console.warn('render err',e.message)}
  check('renderReplicaOverlay 不抛错',()=>renderOk);
  check('renderReplicaOverlay 至少 10 次绘制调用',()=>renderTouched);
  check('toggleReplica 暴露在 AB_TEST',()=>typeof win.toggleReplica === 'function');
  // Toggle on/off without throwing and without breaking state
  const prevRep = t.state.replica;
  let toggleOk = true;
  try{
    win.toggleReplica();  // on
    win.toggleReplica();  // off
  }catch(e){toggleOk=false}
  check('toggleReplica on/off 不抛错',()=>toggleOk);
  t.state.replica = prevRep;
  // Re-render after toggle should still work
  let reRenderOk = false;
  try{
    const calls2=[];
    R.renderReplicaOverlay(buildFakeCtx(calls2), G, 800, 500, {pad:18});
    reRenderOk = calls2.length >= 5;
  }catch(e){reRenderOk=false}
  check('toggleReplica 后再次渲染仍正常',()=>reRenderOk);

  // ═══ Round 3 — map-replica-v1 perf layer (viewport + cache + FPS + LOD) ═══
  check('BRIDGES 至少 30 桥 (R3 扩容)',()=>G.BRIDGES.length >= 30);
  check('validate() 现在要求 bridges >= 30',()=>G.validate().ok);
  // R3 — Set duck-type check (instanceof Set breaks across iframe realms)
  check('FAMOUS_BRIDGES 是 Set 且含 magere_brug',()=>R && R.FAMOUS_BRIDGES && typeof R.FAMOUS_BRIDGES.has === 'function' && R.FAMOUS_BRIDGES.has('magere_brug'));
  check('FAMOUS_BRIDGES 含 oosterdokbrug',()=>R && R.FAMOUS_BRIDGES.has('oosterdokbrug'));
  const vp3 = R.viewportFit(G, 800, 500, 24);
  const rect3 = R.viewportRect(vp3, 800, 500, 24);
  check('viewportRect 返回 {x0,y0,x1,y1}',()=>rect3 && Number.isFinite(rect3.x0) && Number.isFinite(rect3.y0) && Number.isFinite(rect3.x1) && Number.isFinite(rect3.y1));
  check('inViewport 内部 true',()=>R.inViewport(400, 250, 5, rect3) === true);
  check('inViewport 外部 false',()=>R.inViewport(-1000, -1000, 5, rect3) === false);
  const bridgesProj = G.BRIDGES.map(b=>R.projectBridge(G, b, vp3)).filter(Boolean);
  check('bridgeLOD 默认 scale=1 返回全部',()=>R.bridgeLOD(bridgesProj, 1.0).length === bridgesProj.length);
  const lodLow = R.bridgeLOD(bridgesProj, 0.3);
  check('bridgeLOD scale=0.3 仅返回著名桥 (< 总数)',()=>lodLow.length < bridgesProj.length && lodLow.length >= 5);
  check('bridgeLOD scale=0.3 返回的桥全部是著名桥',()=>lodLow.every(b=>R.FAMOUS_BRIDGES.has(b.id)));
  R.fpsReset();
  for(let i=0;i<10;i++) R.fpsTick(performance.now() + i*16);
  check('fpsTick + fpsNow 返回 > 0',()=>R.fpsNow() > 0);
  R.fpsReset();
  R.fpsTick(100); R.fpsTick(116);
  check('frameMs 返回最近帧 ms (≈16)',()=>R.frameMs() >= 14 && R.frameMs() <= 17);
  R.fpsReset();
  R.fpsTick(100); R.fpsTick(116);
  R.fpsReset();
  check('fpsReset 后 fpsNow=0',()=>R.fpsNow() === 0);
  check('clearStaticCache 不抛错',()=>{try{R.clearStaticCache(G);return true}catch(e){return false}});
  // Static layer cache — only meaningful in browser (iframe has DOM)
  let cacheHitOk = true, cacheNoThrow = true;
  try{
    R.clearStaticCache(G);
    const a = R.getStaticLayer(G, 800, 500, {pad:18});
    const b = R.getStaticLayer(G, 800, 500, {pad:18});
    if(!a || !b || b.hit !== true) cacheHitOk = false;
  }catch(e){cacheNoThrow=false}
  check('getStaticLayer 第二次 hit=true',()=>cacheHitOk);
  check('getStaticLayer 不抛错',()=>cacheNoThrow);
  // drawBridges cull + LOD return shape
  const scene3 = R.buildReplicaScene(G, 800, 500, {pad:18});
  const drawResult = R.drawBridges(buildFakeCtx([]), scene3, {rect:rect3, lod:true, cull:true});
  check('drawBridges 返回 {drawn, culled}',()=>drawResult && typeof drawResult.drawn === 'number' && typeof drawResult.culled === 'number');
  check('drawBridges culled >= 0',()=>drawResult.culled >= 0);
  // renderReplicaOverlay with cache:true in real DOM canvas
  let cacheRenderOk = true;
  try{
    const realCanvas = document.createElement('canvas');
    realCanvas.width = 800; realCanvas.height = 500;
    const realCtx = realCanvas.getContext('2d');
    const ret = R.renderReplicaOverlay(realCtx, G, 800, 500, {pad:18, cache:true});
    if(!ret || !ret.scene) cacheRenderOk = false;
  }catch(e){cacheRenderOk=false}
  check('renderReplicaOverlay(cache:true) 不抛错',()=>cacheRenderOk);
  // AB_TEST exposes fpsNow/frameMs/bridgeCount
  check('AB_TEST.fpsNow 是函数',()=>typeof t.fpsNow === 'function');
  check('AB_TEST.frameMs 是函数',()=>typeof t.frameMs === 'function');
  check('AB_TEST.bridgeCount() >= 30',()=>t.bridgeCount() >= 30);

  // ═══ Round 4 — UI integration (introspection + bindings + E2E smoke) ═══
  // 4a · getReplSceneStats single-call introspection
  check('getReplSceneStats 是函数',()=>typeof t.getReplSceneStats === 'function');
  const stats = t.getReplSceneStats(800, 500);
  check('getReplSceneStats 不返回 null',()=>stats !== null);
  check('stats.counts.landmarks=30 (R5)',()=>stats && stats.counts && stats.counts.landmarks === 30);
  check('stats.counts.canals=9',()=>stats && stats.counts.canals === 9);

  // Brief §验收 #5 — 帧率 ≥30 FPS. R3 wired the perf object, but the ≥30 guarantee
  // has to be provable in a *running* browser (not just stub fpsTick calls).
  //   · API shape — getReplSceneStats().perf carries fps / frameMs / samples.
  //   · Reset semantics — fpsReset clears the rolling window.
  //   · Warm-up — after several ticks, perf.samples grows and fps is finite.

  check('R7 · getReplSceneStats 返回 stats 对象',()=>perfStats !== null);
  check('R7 · perf 是 object',()=>perfStats && typeof perfStats.perf === 'object' && perfStats.perf !== null);
  check('R7 · perf.fps 是有限数字',()=>perfStats && Number.isFinite(perfStats.perf.fps) && perfStats.perf.fps >= 0);
  check('R7 · perf.frameMs 是有限数字',()=>perfStats && Number.isFinite(perfStats.perf.frameMs) && perfStats.perf.frameMs >= 0);
  check('R7 · perf.samples 是非负整数',()=>perfStats && Number.isInteger(perfStats.perf.samples) && perfStats.perf.samples >= 0);

  // 7b · fpsReset semantics — clears both the rolling window and current fps
  let resetOk = true;
  try {
    R.fpsReset();
    const s = t.getReplSceneStats(800, 500);
    if (!s || s.perf.samples !== 0 || s.perf.fps !== 0) resetOk = false;
  } catch (e) { resetOk = false; }
  check('R7 · fpsReset 后 perf.samples=0 且 perf.fps=0',()=>resetOk);

  // 7c · warm-up — simulate 60 ticks at 16.67 ms; expect fps ≈ 60, samples=59
  // (fpsTick skips the first tick because it only records the dt between ticks,
  //  so N ticks produces N-1 samples.)
  let warmOk = true;
  try {
    R.fpsReset();
    for (let i = 0; i < 60; i++) R.fpsTick(performance.now() + i * (1000 / 60));
    const s = t.getReplSceneStats(800, 500);
    if (!s || s.perf.samples !== 59 || Math.abs(s.perf.fps - 60) > 1) warmOk = false;
  } catch (e) { warmOk = false; }
  check('R7 · 60 ticks @60Hz 后 perf.samples=59 且 perf.fps≈60',()=>warmOk);

  // 7d · perf object survives the replica-on path (no NaN, no negative)
  let replicaPerfOk = true;
  try {
    const prevRep = t.state.replica;

      }
    } else { livePerfDetail = 'fetch not ok'; }
  } catch (e) { livePerfDetail = 'err:' + e.message; }
  if (livePerfDetail) console.warn('R7 perf:', livePerfDetail);
  check('R7 · PERF_RESULTS.json · 3 scenarios p95 ≤ 16ms · 0 errs',()=>livePerfOk);

  // ═══ Round 8 — map-replica-v1 polish (label declutter + mini-map panel) ═══
  // Brief §验收 #1 demands "真实 Amsterdam 地图渲染(运河、桥、街、地标)"; with
  // 30 landmarks crammed into 800×500 the centre cluster paints 5-6 labels on
  // top of each other. R8 adds:
  //   · planLandmarkLabels — pure-data declutter pass (priority + stack +
  //     leader-line abbrev + hide). Tests verify determinism + zero overlap.
  //   · drawMiniMap — 90×90 corner panel so hidden labels are still findable.
  //   · getReplSceneStats.labels — `{ total, shown, hidden, leaderLines }`
  //     block so a console or test can assert declutter actually fired.

  // 8a · API surface — new exports exist + have the right shape.
  check('R8 · planLandmarkLabels 是函数',()=>typeof R.planLandmarkLabels === 'function');
  check('R8 · declutterStats 是函数',()=>typeof R.declutterStats === 'function');
  check('R8 · drawMiniMap 是函数',()=>typeof R.drawMiniMap === 'function');
  check('R8 · LM_PRIORITY 是 object',()=>R.LM_PRIORITY && typeof R.LM_PRIORITY === 'object' && R.LM_PRIORITY.museum >= R.LM_PRIORITY.venue);

  // 8b · Determinism — same input twice produces identical plan arrays.
  const sceneR8 = R.buildReplicaScene(G, 800, 500, {pad:18});
  const planA = R.planLandmarkLabels(sceneR8, 500);
  const planB = R.planLandmarkLabels(sceneR8, 500);
  check('R8 · planLandmarkLabels 确定性 · 同输入两次输出相等',()=>JSON.stringify(planA) === JSON.stringify(planB));

  // 8c · plan is exactly landmarks.length plans — no drops or duplicates.
  check('R8 · plan 长度 = landmarks 数',()=>planA.length === sceneR8.landmarks.length);

  // 8d · Every plan references its landmark by id (no orphan / cross-wired plans).
  const idSet = new Set(sceneR8.landmarks.map(l => l.id));
  check('R8 · 每个 plan._shown 都有对应 landmark id',()=>planA.every(p => p.landmark && idSet.has(p.landmark.id)));

  // 8e · Zero overlap — for any two SHOWN plans whose _rect lands inside the
  // canvas, their text rects must not intersect. This is the central
  // declutter guarantee.
  function _rectsOverlap(a, b) {
    return !(a.x + a.w < b.x || b.x + b.w < a.x ||
             a.y + a.h < b.y || b.y + b.h < a.y);
  }
  let overlapFree = true;
  const shown = planA.filter(p => p._shown && p._rect);
  for (let i = 0; i < shown.length && overlapFree; i++) {
    for (let j = i + 1; j < shown.length; j++) {
      if (_rectsOverlap(shown[i]._rect, shown[j]._rect)) { overlapFree = false; break; }
    }
  }
  check('R8 · 任何两个已显示 label rect 互不重叠',()=>overlapFree);

  // 8f · Clipping — every shown rect sits inside the canvas (with a 6-px
  // bottom allowance matching the planner). Pins below the canvas aren't
  // rendered, so neither should their labels.
  let allInBounds = true;
  for (const p of shown) {
    const r = p._rect;
    if (r.x < 0 || r.y < 0 || r.x + r.w > 800 || r.y + r.h > 500 - 6) {
      allInBounds = false; break;
    }
  }
  check('R8 · 所有 shown rect 都在 canvas 内',()=>allInBounds);

  // 8g · Priority ordering — a museum landmark before a venue landmark must
  // win its natural (row 0) slot when both are free.
  const freeScene = {
    landmarks: [
      { id: 'v1', kind: 'venue',    nameZh: 'V1', name: 'V1', x: 50,  y: 100, color: '#888', icon: 'X' },
      { id: 'm1', kind: 'museum',   nameZh: 'M1', name: 'M1', x: 700, y: 100, color: '#888', icon: 'X' },
    ],
    canvas: { W: 800, H: 500 },
  };
  const freePlans = R.planLandmarkLabels(freeScene, 500);
  const m1Plan = freePlans.find(p => p.landmark.id === 'm1');
  const v1Plan = freePlans.find(p => p.landmark.id === 'v1');
  check('R8 · 自由位时 museum 与 venue 都 shown 且 row=0',()=>m1Plan && m1Plan._shown && m1Plan._rect.row === 0 && v1Plan && v1Plan._shown && v1Plan._rect.row === 0);

  // 8h · Centre-cluster declutter — 6 landmarks piled at one point should
  // produce at least one hidden or leader-line entry, proving the pass runs.
  const clusterScene = {
    landmarks: [
      { id: 'a', kind: 'museum',    nameZh: 'Aaaaa', name: 'A', x: 400, y: 250, color: '#888', icon: 'X' },
      { id: 'b', kind: 'station',   nameZh: 'Bbbbb', name: 'B', x: 402, y: 252, color: '#888', icon: 'X' },
      { id: 'c', kind: 'square',    nameZh: 'Ccccc', name: 'C', x: 404, y: 254, color: '#888', icon: 'X' },
      { id: 'd', kind: 'district',  nameZh: 'Ddddd', name: 'D', x: 406, y: 256, color: '#888', icon: 'X' },
      { id: 'e', kind: 'park',      nameZh: 'Eeeee', name: 'E', x: 408, y: 258, color: '#888', icon: 'X' },
      { id: 'f', kind: 'venue',     nameZh: 'Fffff', name: 'F', x: 410, y: 260, color: '#888', icon: 'X' },
    ],
    canvas: { W: 800, H: 500 },
  };
  const clusterPlans = R.planLandmarkLabels(clusterScene, 500);
  const cs = R.declutterStats(clusterPlans);
  check('R8 · 6-landmark 簇 · shown + hidden = 6',()=>cs.shown + cs.hidden === 6);
  check('R8 · 6-landmark 簇 · hidden ≥ 1 或 leaderLines ≥ 1',()=>cs.hidden >= 1 || cs.leaderLines >= 1);
  check('R8 · 6-landmark 簇 · 无重叠 (再次验证)',()=>{
    const s = clusterPlans.filter(p => p._shown && p._rect);
    for (let i = 0; i < s.length; i++)
      for (let j = i + 1; j < s.length; j++)
        if (_rectsOverlap(s[i]._rect, s[j]._rect)) return false;
    return true;
  });

  // 8i · declutterStats block in getReplSceneStats — exposed for console/tests.
  const r8stats = t.getReplSceneStats(800, 500);
  check('R8 · stats.labels 是 object',()=>r8stats && r8stats.labels && typeof r8stats.labels === 'object');
  check('R8 · stats.labels.total = 30',()=>r8stats && r8stats.labels && r8stats.labels.total === 30);
  check('R8 · stats.labels.shown ≤ total',()=>r8stats && r8stats.labels && r8stats.labels.shown <= r8stats.labels.total);
  check('R8 · stats.labels.shown + hidden = total',()=>r8stats && r8stats.labels && r8stats.labels.shown + r8stats.labels.hidden === r8stats.labels.total);
  check('R8 · stats.labels.leaderLines 是非负整数',()=>r8stats && r8stats.labels && Number.isInteger(r8stats.labels.leaderLines) && r8stats.labels.leaderLines >= 0);

  // 8j · Mini-map — drawMiniMap returns a well-formed rect and lives in the
  // bottom-right corner (x+w near canvas W, y+h near canvas H). It must NOT
  // overlap the bottom-left scale bar.
  let mmRect = null;
  try {
    const mmCanvas = document.createElement('canvas');
    mmCanvas.width = 800; mmCanvas.height = 500;
    const mmCtx = mmCanvas.getContext('2d');
    mmRect = R.drawMiniMap(mmCtx, sceneR8, {});
  } catch (e) { mmRect = null; }
  check('R8 · drawMiniMap 返回 rect',()=>mmRect && typeof mmRect.x === 'number' && typeof mmRect.y === 'number' && typeof mmRect.w === 'number' && typeof mmRect.h === 'number');
  check('R8 · mini-map 位于右下角 (x > W/2 · y > H/2)',()=>mmRect && mmRect.x > 400 && mmRect.y > 250);
  check('R8 · mini-map 不与 1 km 比例尺重叠 (x+w 远离 x≤32)',()=>mmRect && (mmRect.x > 32 + 64));
  // Mini-map plots only the landmarks that fall inside the viewport rect (it
  // mirrors the player's view, not the full geo extent), so we expect a
  // non-empty subset of the 30. Asserting equality was wrong — earlier
  // rounds already verified geo coverage via buildReplicaScene.
  check('R8 · mini-map 至少绘出 1 个地标点',()=>mmRect && mmRect.plotted >= 1 && mmRect.plotted <= sceneR8.landmarks.length);
  // opt-out flag works
  let mmOptOut = null;
  try {
    const mmCanvas2 = document.createElement('canvas');
    mmCanvas2.width = 800; mmCanvas2.height = 500;
    mmOptOut = R.drawMiniMap(mmCanvas2.getContext('2d'), sceneR8, { miniMap: false });
  } catch (e) { mmOptOut = 'err'; }
  check('R8 · opts.miniMap=false 时不渲染',()=>mmOptOut === null);

  // 8k · renderReplicaOverlay now includes the mini-map (no throw, no regression).
  let r8RenderOk = true;
  try {
    R.clearStaticCache(G);
    const c = document.createElement('canvas');
    c.width = 800; c.height = 500;
    R.renderReplicaOverlay(c.getContext('2d'), G, 800, 500, {pad:18, cache:true});
  } catch (e) { r8RenderOk = false; }
  check('R8 · renderReplicaOverlay 在新图层下不抛错',()=>r8RenderOk);

  const h=document.createElement('h2');h.className=passed===total?'pass':'fail';h.textContent=`${passed}/${total} PASS`;results.prepend(h);
});
setTimeout(()=>{if(results.textContent==='正在加载…')results.innerHTML='<h2 class="fail">FAIL — Demo 加载超时</h2>'},15000);
</script></body></html>
