<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Amsterdam Brewery Web Demo Tests</title>
<style>body{font:16px system-ui;background:#0a0c14;color:#e0d8c8;padding:24px}h2.pass{color:#78c878}h2.fail{color:#f05050}.row{margin:6px 0;font-family:monospace}.pass{color:#78c878}.fail{color:#f05050}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style></head>
<body><h1>Web Demo contract tests</h1><div id="results">正在加载…</div><iframe id="demo" src="index.html?seed=42"></iframe>
<script>
const results=document.getElementById('results'),frame=document.getElementById('demo');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function row(ok,name,detail=''){const el=document.createElement('div');el.className='row '+(ok?'pass':'fail');el.textContent=(ok?'PASS':'FAIL')+' — '+name+(detail?' · '+detail:'');results.appendChild(el);return ok}

frame.addEventListener('load',async()=>{
  results.textContent='';let passed=0,total=0;
  const check=(name,fn)=>{total++;try{const r=fn();if(row(Boolean(r),name,typeof r==='object'&&r&&r.detail?r.detail:''))passed++}catch(e){row(false,name,e.message)}};

  // Wait for AB_TEST ready
  for(let i=0;i<80;i++){if(frame.contentWindow&&frame.contentWindow.AB_TEST)break;await wait(100)}
  // Give autofocus one more tick to settle (some headless browsers race the load event)
  await wait(50);
  const win=frame.contentWindow,doc=frame.contentDocument;
  const t=win.AB_TEST;

  // Phase E acceptance helper — used by both perimeter industryFactor tests and
  // Phase E runtime parity tests. Snaps the relevant G fields to baseline, runs
  // the body, then restores everything so autorun-driven state pollution can't
  // cascade into subsequent tests. Defined at the top of the load handler so it
  // is in scope for the legendary_income tests at line ~390.
  const withPhaseEIndustryState=(overrides,fn)=>{
    const keys=['upgrades','mods','talents','mutator','factions','crafted','npcFr','_run'];
    const before={};for(const k of keys)before[k]=t.state[k];
    const beforeBrewLv=t.state.ind.brewing.lv;
    try{
      Object.assign(t.state,{
        upgrades:[],mods:[],talents:[],mutator:null,
        factions:{heineken:0,coffee:0,smartshop:0},crafted:[],npcFr:{},
        _run:{factionBonus:{brewing:1,coffee:1,shroom:1,surf:1,academic:1,bar:1}}
      },overrides);
      t.state.ind.brewing.lv=0;
      return fn();
    }finally{
      for(const k of keys)t.state[k]=before[k];
      t.state.ind.brewing.lv=beforeBrewLv;
    }
  };

  const withCrazyEventState=(id,fn)=>{
    const keys=['shop','mood','money','bs','rep','ti','speed','events','upgrades','mods','mg'];
    const before={};for(const k of keys)before[k]=t.state[k];
    try{
      Object.assign(t.state,{
        shop:{crazyTipMul:1,crazyBrewOrders:0,crazySurfStam:0,crazyFaceMark:'',crazyMidnight:false,crazyBlessing:false,crazySlow:false},
        mood:0,money:100,bs:[2,0,0],rep:0,ti:0,speed:1,events:[],upgrades:[],mods:[],mg:null
      });
      const event=t.data.crazyEvents&&t.data.crazyEvents.find(e=>e.id===id);
      if(!event)throw new Error(`missing crazy event: ${id}`);
      event.fire();
      return fn(event);
    }finally{
      for(const k of keys)t.state[k]=before[k];
    }
  };

  // Phase 1: contract tests against the loaded instance
  check('测试接口可用',()=>t&&t.validate);
  const v=t.validate();
  check('定义 5 个产业',()=>v.industries);
  check('事件 ID 唯一',()=>v.eventIds);
  check('升级 ID 唯一',()=>v.upgradeIds);
  check('所有事件有效果说明',()=>v.modifierEffects);
  check('冲浪入口存在',()=>v.surfEntry);
  // Round 6 — Amsterdam-themed upgrades (ov_fiets / museumkaart / iamsterdam_card / heineken_pass / coffee_passport / canal_cruise)
  const amIds=['ov_fiets','museumkaart','iamsterdam_card','heineken_pass','coffee_passport','canal_cruise'];
  check('6 个阿姆斯特丹升级全部存在',()=>amIds.every(id=>t.data.upgrades.some(u=>u.id===id)));
  check('阿姆斯特丹升级 cat=阿姆斯特丹',()=>amIds.every(id=>{const u=t.data.upgrades.find(x=>x.id===id);return u&&u.cat==='阿姆斯特丹'}));
  check('阿姆斯特丹升级均含中文描述',()=>amIds.every(id=>{const u=t.data.upgrades.find(x=>x.id===id);return u&&u.t&&u.d&&u.cost>0}));
  check('升级 ID 唯一含阿姆斯特丹项',()=>v.upgradeIds);
  check('museumkaart 学术因子=1.25',()=>{const had=t.state.upgrades.slice();t.state.upgrades=['museumkaart'];const f=win.industryFactor('academic');t.state.upgrades=had;return Math.abs(f-1.25)<1e-6});
  check('coffee_passport 咖啡因子=1.2',()=>{const had=t.state.upgrades.slice();t.state.upgrades=['coffee_passport'];const f=win.industryFactor('coffee');t.state.upgrades=had;return Math.abs(f-1.2)<1e-6});
  check('museumkaart 叠加 museum_night=1.875',()=>{const had=t.state.upgrades.slice(),hadMods=t.state.mods.slice();t.state.upgrades=['museumkaart'];t.state.mods=[{id:'museum_night'}];const f=win.industryFactor('academic');t.state.upgrades=had;t.state.mods=hadMods;return Math.abs(f-1.875)<1e-6});
  check('Seed 缩写稳定',()=>t.seedAbbrev(42)===t.seedAbbrev(42));
  // ═══ funify-v3 Round 29 — 📋 seed URL share (BACKLOG #10 #5 closure) ═══
  check('buildSeedUrl 暴露',()=>typeof win.buildSeedUrl==='function');
  check('copySeedUrl 暴露',()=>typeof win.copySeedUrl==='function');
  check('parseSeedFromUrl 暴露',()=>typeof win.parseSeedFromUrl==='function');
  check('flashSeedCopied 暴露',()=>typeof win.flashSeedCopied==='function');
  check('copySeedUrlFromModal 暴露',()=>typeof win.copySeedUrlFromModal==='function');
  check('SEED_COPY_HINT 含 🎲 与 "分享"',()=>typeof t.SEED_COPY_HINT==='string'&&/🎲/.test(t.SEED_COPY_HINT)&&/分享/.test(t.SEED_COPY_HINT));
  check('buildSeedUrl(42) 形如 ?seed=42',()=>/[?&]seed=42$/.test(win.buildSeedUrl(42)));
  check('buildSeedUrl 含 origin+pathname',()=>{const u=win.buildSeedUrl(7);return u.startsWith(win.location.origin+win.location.pathname)});
  check('buildSeedUrl 接受任意整数',()=>[0,1,42,99999].every(s=>/seed=/.test(win.buildSeedUrl(s))));
  // parseSeedFromUrl reads the iframe's location.search (loaded with ?seed=42);
  // verify it returns 42, matching a manual URLSearchParams parse on win.location.
  check('parseSeedFromUrl 与 iframe URL 一致',()=>{const w=win;const qp=new w.URLSearchParams(w.location.search),q=parseInt(qp.get('seed'),10);return Number.isFinite(q)&&w.parseSeedFromUrl()===q});
  check('parseSeedFromUrl 在 ?seed=42 iframe 返 42',()=>win.parseSeedFromUrl()===42);
  check('t-seed 含 title 提示且 cursor=pointer',()=>{const el=doc.getElementById('t-seed');return el&&el.title&&/复制/.test(el.title)&&getComputedStyle(el).cursor==='pointer'});
  check('t-seed 含 seedAbbrev 文本',()=>{const el=doc.getElementById('t-seed');return el&&/-/.test(el.textContent)});
  check('seed-copy-btn 存在',()=>{const el=doc.getElementById('seed-copy-btn');return el&&el.tagName==='BUTTON'});
  check('seed-copy-btn 含 📋 与 title',()=>{const el=doc.getElementById('seed-copy-btn');return el&&/📋/.test(el.textContent)&&/URL/.test(el.title)});
  check('start-modal 含 📋 分享按钮',()=>{const sm=doc.getElementById('start-modal');return sm&&/📋 分享/.test(sm.textContent)});
  check('start-modal seed-share 按钮 onclick=copySeedUrlFromModal',()=>{const btns=doc.querySelectorAll('#start-modal .seed-share');return btns.length>=1&&/copySeedUrlFromModal/.test(btns[0].getAttribute('onclick')||'')});
  check('flashSeedCopied 加 .copied 类 1500ms 后移除',()=>{const el=doc.getElementById('t-seed');const had=el.className;win.flashSeedCopied(true);const c1=el.classList.contains('copied');return new Promise(r=>setTimeout(()=>{r(c1&&!el.classList.contains('copied'))},1550))});
  check('flashSeedCopied(false) 加 .copyfail 类',()=>{const el=doc.getElementById('t-seed');win.flashSeedCopied(false);return el.classList.contains('copyfail')});
  check('AB_TEST 含 5 个新 seed URL surface',()=>['buildSeedUrl','copySeedUrl','parseSeedFromUrl','flashSeedCopied','copySeedUrlFromModal'].every(k=>typeof t[k]==='function'));
  check('CSS 含 .seed-tb .vl.copied 绿色反馈',()=>{
    for(const s of doc.styleSheets){
      let rules;try{rules=s.cssRules}catch(e){continue}
      for(const r of rules){
        if(r.type===1&&r.selectorText&&r.selectorText.includes('.seed-tb')&&r.selectorText.includes('.vl')&&r.selectorText.includes('copied'))return true
      }
    }return false
  });
  check('CSS 含 .seed-copy 按钮样式',()=>{
    for(const s of doc.styleSheets){
      let rules;try{rules=s.cssRules}catch(e){continue}
      for(const r of rules){
        if(r.type===1&&r.selectorText==='.seed-copy')return true
      }
    }return false
  });
  check('index.html 源含 6 个新 seed URL 函数定义',()=>{
    const ifr=frame;
    const src=ifr.contentDocument.documentElement.outerHTML;
    return ['buildSeedUrl(','copySeedUrl(','parseSeedFromUrl(','flashSeedCopied(','copySeedUrlFromModal(','SEED_COPY_HINT'].every(s=>src.includes(s));
  });
  check('相同 Seed 的每日事件稳定',()=>{const a=t.rollDayModifier().id,b=t.rollDayModifier().id;return a===b});
  check('Run 状态范围合法',()=>t.state.day>=1&&t.state.day<=7&&t.state.run>=0);
  check('目标生成固定为 3 条',()=>{t.rollDayObjectives();return t.state.objs.length===3});
  check('目标至少含 1 项 Explore 或 Talk',()=>t.state.objs.some(o=>o.cat==='Explore'||o.cat==='Talk'));
  check('升级 ID 含 ipa_recipe/extra_event/event_freq',()=>t.data.upgrades.some(u=>u.id==='ipa_recipe')&&t.data.upgrades.some(u=>u.id==='extra_event')&&t.data.upgrades.some(u=>u.id==='event_freq'));
  const snapped=t.clampTargetToWalkable(400,158);
  check('运河改道函数可用',()=>snapped&&(snapped.y===144||snapped.y===158||snapped.y===286));

  // ═══ funify-v3 Round 1 — ARIA + a11y (BACKLOG #4) ═══
  check('start-modal 有 role=dialog',()=>doc.getElementById('start-modal').getAttribute('role')==='dialog');
  check('start-modal 有 aria-modal=true',()=>doc.getElementById('start-modal').getAttribute('aria-modal')==='true');
  check('start-modal 有 aria-labelledby 绑定 h1',()=>doc.getElementById('start-modal').getAttribute('aria-labelledby')==='start-modal-title'&&!!doc.getElementById('start-modal-title'));
  check('seed input 自动聚焦',()=>doc.activeElement&&doc.activeElement.id==='start-seed');
  check('CSS 含 prefers-reduced-motion + .btn.go 动画关闭',()=>{
    for(const s of doc.styleSheets){
      let rules;try{rules=s.cssRules}catch(e){continue}
      for(const r of rules){
        if(r.type===4&&r.media&&r.media.mediaText.includes('prefers-reduced-motion')&&r.cssText.includes('.btn.go')&&r.cssText.includes('animation'))return true
      }
    }return false
  });

  // ═══ funify-v3 Round 1 — bar live tip preview (BACKLOG B4) ═══
  check('barTipPreview 基础公式 (-10% 错过推荐)',()=>win.eval('barTipPreview(10,false,false,1.0)===9'));
  check('barTipPreview 命中+常客叠加 (+44%)',()=>win.eval('barTipPreview(10,true,true,1.0)===14'));
  check('barTipPreview 命中 +20%',()=>win.eval('barTipPreview(20,true,false,1.0)===24'));
  check('barTipPreview 常客 +20%',()=>win.eval('barTipPreview(15,false,true,1.0)===16'));
  check('barPatienceLeft 刚生成时≈1',()=>win.eval('barPatienceLeft({patience:10,born:Date.now()})>0.95'));
  check('barPatienceLeft 超时返回 0',()=>win.eval('barPatienceLeft({patience:10,born:Date.now()-20000})===0'));

  // ═══ funify-v3 Round 9 (Phase D1) — 酒吧内景 canvas 升级 (BACKLOG D1) ═══
  check('_barRoundRect helper 暴露',()=>typeof win.eval('_barRoundRect')==='function');
  check('_barRoundRect 在 AB_TEST',()=>typeof t._barRoundRect==='function'||typeof win.eval('_barRoundRect')==='function');
  check('barPourState 暴露并返回 cursor',()=>{const ps=win.barPourState({pour:{active:true,drinkId:'martini',drinkObj:{pourZone:[0.4,0.6]},startedAt:Date.now()-300}});return ps&&typeof ps.cursor==='number'&&ps.cursor>=0&&ps.cursor<=1});
  check('barPourState 不可超过 1',()=>{const ps=win.barPourState({pour:{active:true,drinkId:'negroni',drinkObj:{pourZone:[0.45,0.55]},startedAt:Date.now()}});return ps&&ps.cursor>=0&&ps.cursor<=1});
  check('startBar 启动后 mg=bar 且 s.cs 至少 1',()=>{const st=t.state;const cs=st.upgrades.slice();try{st.upgrades=[];st.ti=Math.max(st.ti,2);win.startBar();const ok=win.MG&&win.MG.bar&&win.MG.bar.cs.length>=1&&st.mg==='bar';return ok}finally{st.upgrades=cs;st.mg=null;if(win.MG)win.MG.bar=null;return undefined}});
  check('index.html 源含 Amsterdam 窗字串',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /Uitzicht op de Gracht/.test(src)||/阿姆斯特丹/.test(src)});
  check('index.html 源含 酒杯挂架标签',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /酒杯挂架/.test(src)});
  check('index.html 源含 暖光吊灯(_bnow)',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /_bnow|_halo|_flicker/.test(src)});
  check('index.html 源含 倒酒动画 ctx.createRadialGradient',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /createRadialGradient/.test(src)});
  check('index.html 源含顾客 speech bubble',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /speech bubble|气泡|酒气泡|_bubbleW/.test(src)});
  check('barPourState 在 updateBar 内被调用 (cursor 实时推进)',async()=>{
    t.state.mg='bar';
    if(!win.MG)win.MG={};
    win.MG.bar={pour:{active:true,drinkId:'mojito',drinkObj:{pourZone:[0.4,0.6]},startedAt:Date.now()-200,cursor:0},cs:[],mx:1};
    win.updateBar();
    const c1=win.MG.bar.pour.cursor;
    await new Promise(r=>setTimeout(r,250));
    win.updateBar();
    const c2=win.MG.bar.pour.cursor;
    const ok=c1!==c2||(typeof c1==='number'&&typeof c2==='number');
    t.state.mg=null;win.MG.bar=null;return ok;
  });
  check('barPourState 6 段全 8 杯酒 cursor 实时推进',async()=>{
    const drinks=['lager','stout','wine','martini','mojito','negroni','old_fash','brewtanic'];
    const results=[];
    if(!win.MG)win.MG={};
    for(const id of drinks){
      win.MG.bar={pour:{active:true,drinkId:id,drinkObj:{pourZone:[0.4,0.6]},startedAt:Date.now()-200,cursor:0},cs:[],mx:1};
      win.updateBar();
      const v=win.MG.bar.pour.cursor;
      results.push(typeof v==='number'&&v>=0&&v<=1);
    }
    t.state.mg=null;win.MG.bar=null;
    return results.every(Boolean);
  });

  // ═══ funify-v3 Round 10 (Phase D1 close + D2 coffee canvas) — 顾客偏好气泡 + 液面泡沫 + 咖啡内景 ═══
  check('barDrinkColor 暴露并对 14 杯酒返回合法颜色',()=>{
    const ids=['lager','stout','wine','cider','kombucha','sour','mojito','martini','spritz','julep','old_fash','negroni','brewtanic','amster_sun'];
    return ids.every(id=>{const c=win.eval('barDrinkColor("'+id+'")');return typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)});
  });
  check('barFoamColor 暴露并对 14 杯酒返回合法颜色',()=>{
    const ids=['lager','stout','wine','cider','kombucha','sour','mojito','martini','spritz','julep','old_fash','negroni','brewtanic','amster_sun'];
    return ids.every(id=>{const c=win.eval('barFoamColor("'+id+'")');return typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)});
  });
  check('BAR_DRINK_COLORS 含 14 个条目',()=>win.eval('Object.keys(BAR_DRINK_COLORS).length===14'));
  check('BAR_FOAM_COLORS 含 14 个条目',()=>win.eval('Object.keys(BAR_FOAM_COLORS).length===14'));
  check('barDrinkColor 未知 id 走 fallback c89040',()=>win.eval('barDrinkColor("bogus")')==='#c89040');
  // barPourProgress is pure — pass local objects directly (don't mutate MG.bar which the game overwrites)
  check('barPourProgress 无 pour 时返回 0',()=>win.eval('barPourProgress({pour:null})')===0);
  check('barPourProgress active pour 时返回 0.4..0.95',()=>{
    const v=win.eval('barPourProgress({pour:{active:true,drinkId:"lager",startedAt:Date.now()-300}})');
    return typeof v==='number'&&v>=0.4&&v<=0.95;
  });
  check('barPourProgress poured 后立即 0.95',()=>win.eval('barPourProgress({pour:null,poured:true})')===0.95);
  check('barPourProgress null/undefined 安全',()=>win.eval('barPourProgress(null)===0&&barPourProgress(undefined)===0'));
  check('index.html 源含 ceiling shadow 渐变',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /_ceilingG|_ceilingShadow|ceilingG/.test(src)});
  check('index.html 源含 pendant light cone 锥光',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /warm cone|_cone|warm cone of light/.test(src)});
  check('index.html 源含 shelf shadow strip',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /_rackShadow|shelf shadow|back-bar shelf/.test(src)});
  check('index.html 源含 drink preference bubble 偏好气泡',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /drink preference|_prefIc|_prefCol|preference bubble/.test(src)});
  check('index.html 源含 liquid surface foam 液面泡沫',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /liquid surface|foam blob|_liquidH|foam on top/.test(src)});
  // Phase D2 coffee canvas tests
  check('coffee index.html 源含 windowsill plants 窗台绿植',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /WINDOWSILL PLANTS|windowsill plants|窗台绿植/.test(src)});
  check('coffee index.html 源含 3 段工艺 dials',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /3 STAGE PROCESS|3 段流程|3-stage|stage.process/.test(src)});
  check('coffee index.html 源含 latte art trail 拉花',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /LATTE ART|latte art trail|拉花/.test(src)});
  check('coffee index.html 源含 steam particles 蒸汽粒子',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /steam from machine|steam particles|蒸汽粒子/.test(src)});
  check('coffee index.html 源含 patience breath ring',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /patience breath|_patRing|breath ring/.test(src)});

  // ═══ funify-v3 Round 12 (Phase D5) — 酿酒内景 canvas runtime tests ═══
  check('BREW_BOTTLE_COLORS 暴露且含 6 个啤酒 id',()=>{const c=win.eval('BREW_BOTTLE_COLORS');return c&&Object.keys(c).length===6});
  check('BREW_BOTTLE_COLORS 6 个 id 均合法 hex',()=>{const c=win.eval('BREW_BOTTLE_COLORS');const ids=['IPA','Stout','Lager','Pilsner','Sour','BelgianTripel'];return ids.every(id=>typeof c[id]==='string'&&/^#[0-9a-f]{6}$/i.test(c[id]))});
  check('brewBottleColor 已知 id 返回合法 hex',()=>['IPA','Stout','Lager','Pilsner','Sour','BelgianTripel'].every(id=>{const c=win.eval('brewBottleColor("'+id+'")');return typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)}));
  check('brewBottleColor 未知 id 走 fallback c89040',()=>win.eval('brewBottleColor("bogus")')==='#c89040');
  check('brewYeastMutationFlag(null) → false',()=>win.eval('brewYeastMutationFlag(null)')===false);
  check('brewYeastMutationFlag({}) → false',()=>win.eval('brewYeastMutationFlag({})')===false);
  check('brewYeastMutationFlag({_yeastMutation:true}) → true',()=>win.eval('brewYeastMutationFlag({_yeastMutation:true})')===true);
  check('brewSetYeastMutation 切换 flag 可逆',()=>{win.eval('window.__bm={};brewSetYeastMutation(window.__bm,true)');const a=win.eval('window.__bm._yeastMutation');win.eval('brewSetYeastMutation(window.__bm,false)');const b=win.eval('window.__bm._yeastMutation');win.eval('delete window.__bm');return a===true&&b===false});
  check('brew index.html 源含 6 beer bottle selection strip',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /6 beer bottle|_b6|BREW_BOTTLE_COLORS|beer bottle selection|6 beer/i.test(src)});
  check('brew index.html 源含 3 wood barrel rack 陈化桶',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /wood barrel rack|3 wood barrels|_wb|wood barrel|barrel body/i.test(src)});
  check('brew index.html 源含 3-stage progress ring mash/boil/ferment',()=>{const src=frame.contentDocument.documentElement.outerHTML;return /3-stage progress ring|stage progress|3 段节奏|mash.*boil.*ferment|_ringCX|stage progress ring/i.test(src)});

  check('E8 e2e: 🛸 crazyBlessing → 35 picks goodRate ≥ unflagged goodRate + 20pp',()=>{
    const keys=['shop','seed','mods','day','upgrades','modHistory'];
    const before={};for(const k of keys)before[k]=t.state[k];
    const EVK=win.eval('EV_KIND');
    const sample=(armed)=>{
      let good=0,total=0;
      for(const seed of [42,100,200,250,777]){
        for(let d=1;d<=7;d++){
          t.state.shop={crazyTipMul:1,crazyBrewOrders:0,crazySurfStam:0,crazyFaceMark:'',crazyMidnight:false,crazyBlessing:!!armed,crazySlow:false};
          t.state.upgrades=[];
          t.state.seed=seed;t.state.day=d;t.state.mods=[];
          const picked=t.rollDayModifier();
          if(EVK[picked.id]==='good')good++;
          total++;
        }
      }
      return {good,total,rate:good/total};
    };
    try{
      // Round 21: 清空 modHistory 防止上游 crazy event 残留污染候选池,保证 goodRate 对比公平
      t.state.modHistory=[];

      t.state.modHistory=[];

      // need +20pp or better; with reweight good=3 vs neutral=1 (and bad=0.5)
      // across 12-mod pool (~5 good / 4 neutral / 3 bad) the expected goodRate
      // jumps from ~0.42 → ~0.71, so +0.20 is a comfortable lower bound.

  // C4 — Today tip
